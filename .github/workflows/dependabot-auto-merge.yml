name: Dependabot Auto-Merge

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize]

jobs:
  auto-merge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      checks: read
    steps:
      - name: Read Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Enable auto-merge for patch and minor updates
        if: |
          steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          steps.metadata.outputs.update-type == 'version-update:semver-minor'
        env:
          GH_TOKEN: ${{ secrets.PR_AUTOMATION_PAT }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          required=(
            "app"
            "e2e"
            "desktop (ubuntu-22.04)"
            "desktop (macos-latest)"
            "desktop (windows-latest)"
          )
          deadline=$(( $(date +%s) + 3600 ))
          while :; do
            checks=$(gh api "repos/$REPO/commits/$SHA/check-runs" \
              --jq '[.check_runs[] | {name, status, conclusion}]')
            waiting=0
            for name in "${required[@]}"; do
              conclusion=$(jq -r --arg name "$name" \
                '[.[] | select(.name == $name)] | last | .conclusion // ""' <<<"$checks")
              status=$(jq -r --arg name "$name" \
                '[.[] | select(.name == $name)] | last | .status // ""' <<<"$checks")
              if [ "$conclusion" = "failure" ] || [ "$conclusion" = "cancelled" ] || [ "$conclusion" = "timed_out" ]; then
                echo "::error::$name concluded $conclusion"
                exit 1
              fi
              if [ "$status" != "completed" ] || [ "$conclusion" != "success" ]; then
                waiting=1
              fi
            done
            if [ "$waiting" -eq 0 ]; then
              break
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "$checks"
              echo "::error::Timed out waiting for CI on $SHA"
              exit 1
            fi
            sleep 20
          done
          gh pr merge "$PR" --repo "$REPO" --squash --auto
