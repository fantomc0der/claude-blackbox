name: Claude PR Review

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: |
      github.event.pull_request.draft == false &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1.0.230
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.PR_AUTOMATION_PAT }}
          base_branch: ${{ github.event.pull_request.base.ref }}
          track_progress: true
          use_sticky_comment: true
          include_fix_links: true
          prompt: |
            Review this pull request. Read CLAUDE.md before reviewing the diff.

            Focus on correctness, regressions, privacy and local-data safety, HTTP origin and loopback protections, recorder/index invariants, Solid 2 compatibility, Bun standalone asset behavior, Tauri sidecar lifecycle, and release/CI correctness. Treat generated files and lockfiles according to CLAUDE.md.

            Prefer actionable blocking findings over style commentary. Do not claim a workflow or platform is covered unless the changed behavior is actually exercised by the repository's checks.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
