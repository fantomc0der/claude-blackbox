name: Dependency Maintenance

on:
  schedule:
    - cron: "17 13 * * 3"
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      pull-requests: write
    env:
      BUN_VERSION: 1.4.2
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1
          token: ${{ secrets.PR_AUTOMATION_PAT }}

      - uses: oven-sh/setup-bun@v2
        id: bun
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Verify the pinned Bun
        env:
          BUN_PATH: ${{ steps.bun.outputs.bun-path }}
        run: |
          set -euo pipefail
          if [ ! -x "$BUN_PATH" ]; then
            echo "::error::setup-bun did not report an executable bun-path."
            exit 1
          fi
          version=$("$BUN_PATH" --version)
          if [ "$version" != "$BUN_VERSION" ]; then
            echo "::error::Expected Bun $BUN_VERSION at $BUN_PATH, found $version."
            exit 1
          fi

      - run: bun install --frozen-lockfile

      - name: Check outdated Bun packages, unresolved alerts, and existing maintenance PRs
        id: status
        env:
          GH_TOKEN: ${{ secrets.PR_AUTOMATION_PAT }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          alerts=$(gh api --paginate "repos/$REPO/dependabot/alerts" \
            --jq '[.[] | select(.state == "open")] | length')
          outdated_output=$(bun outdated 2>&1 || true)
          outdated=$(printf '%s\n' "$outdated_output" | awk -F'|' '
            NF >= 5 {
              name=$2
              gsub(/^[[:space:]]+|[[:space:]]+$/, "", name)
              if (name != "" && name != "Package" && name !~ /^-+$/) count++
            }
            END { print count + 0 }
          ')
          existing=$(gh pr list --repo "$REPO" --state open \
            --search 'in:title [DEPENDENCY-MAINTENANCE]' \
            --json number --jq 'length')
          echo "alert_count=$alerts" >> "$GITHUB_OUTPUT"
          echo "outdated_count=$outdated" >> "$GITHUB_OUTPUT"
          if { [ "$alerts" -gt 0 ] || [ "$outdated" -gt 0 ]; } && [ "$existing" -eq 0 ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Found $outdated outdated Bun package(s) and $alerts unresolved alert(s)."
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "Outdated: $outdated; alerts: $alerts; existing maintenance PRs: $existing. Nothing to start."
          fi

      - name: Create maintenance branch
        if: steps.status.outputs.should_run == 'true'
        run: |
          branch="dependency-maintenance/scheduled-${{ github.run_id }}"
          git checkout -b "$branch"
          echo "BRANCH=$branch" >> "$GITHUB_ENV"

      - name: Install Tauri Linux dependencies
        if: steps.status.outputs.should_run == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Update Bun dependencies and resolve remaining alerts with Claude
        if: steps.status.outputs.should_run == 'true'
        uses: anthropics/claude-code-action@v1.0.233
        env:
          ALERT_COUNT: ${{ steps.status.outputs.alert_count }}
          OUTDATED_COUNT: ${{ steps.status.outputs.outdated_count }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.PR_AUTOMATION_PAT }}
          base_branch: main
          # Without this the action installs its own bundled Bun over the pinned
          # one, and that older Bun cannot read this repository's lockfile.
          path_to_bun_executable: ${{ steps.bun.outputs.bun-path }}
          claude_args: |
            --model claude-sonnet-5
            --fallback-model "claude-opus-5[1m]"
            --effort xhigh
            --allowedTools "Read,Edit,Write,Glob,Grep,Bash(gh:*),Bash(bun:*),Bash(cargo:*),Bash(git:*),Bash(rg:*),Bash(cat:*),Bash(ls:*),Bash(pwd:*),Bash(head:*),Bash(tail:*)"
          prompt: |
            REPO: ${{ github.repository }}
            BRANCH: ${{ env.BRANCH }}
            OPEN ALERTS: ${{ steps.status.outputs.alert_count }}
            OUTDATED BUN PACKAGES: ${{ steps.status.outputs.outdated_count }}

            Perform the repository's scheduled dependency maintenance. Read CLAUDE.md first.

            1. Run `bun outdated` and update safe patch and minor JavaScript dependencies. Keep exact pins exact, update related Solid runtime/compiler packages together, and leave major upgrades for a separate human-reviewed PR.
            2. Fetch open security alerts with `gh api --paginate "repos/${{ github.repository }}/dependabot/alerts" --jq '[.[] | select(.state == "open")]'` and make the smallest safe manifest or lockfile changes that resolve them.
            3. This repository uses `package.json` plus `bun.lock` and `src-tauri/Cargo.toml` plus `src-tauri/Cargo.lock`. The `bun` on PATH is the pinned Bun ${{ env.BUN_VERSION }} that understands this lockfile; run `bun --version` first and stop without opening a pull request if it reports anything else. Use `bun install` for JavaScript changes, never edit `bun.lock` by hand, and never create another package-manager lockfile.
            4. Run `bun run check`, `bun run desktop:sidecar`, and `cargo test --locked --manifest-path src-tauri/Cargo.toml`. The pull request CI runs the Edge E2E suite on Windows.
            5. Do not remove tests, weaken security checks, add suppressions, or use type-error escape hatches to make an update pass.
            6. Commit the complete maintenance change, push `${{ env.BRANCH }}`, and open a pull request against `main` titled `chore: scheduled dependency maintenance [DEPENDENCY-MAINTENANCE]`.
            7. In the PR body, list every updated dependency and each security alert addressed. Clearly explain any alert that cannot be fixed without an unsafe major platform upgrade.

      - name: Require the maintenance pull request
        if: steps.status.outputs.should_run == 'true'
        env:
          GH_TOKEN: ${{ secrets.PR_AUTOMATION_PAT }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          pr=$(gh pr list --repo "$REPO" --state open --base main --head "$BRANCH" \
            --json number --jq '.[0].number // empty')
          if [ -z "$pr" ]; then
            echo "::error::Claude completed without opening the required maintenance PR from $BRANCH."
            exit 1
          fi
          echo "Maintenance PR #$pr is open."
          gh workflow run ci.yml --repo "$REPO" --ref "$BRANCH"
          echo "Dispatched CI for $BRANCH."
