name: Desktop release
run-name: Desktop release ${{ inputs.tag }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag to build, such as v0.2.0; the tag and draft release must already exist
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ""
          - platform: ubuntu-22.04-arm
            args: --bundles deb,rpm
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    env:
      APPLE_SIGNING_IDENTITY: ${{ startsWith(matrix.platform, 'macos-') && '-' || '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.platform, 'macos-') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu-')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils libfuse2 file
      - run: bun install --frozen-lockfile
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ inputs.tag }}
          releaseDraft: true
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}

  verify-updater-manifest:
    name: verify updater manifest
    needs: build
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - name: Download and verify latest.json
        shell: bash
        run: |
          release_id=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq ".[] | select(.tag_name == \"$RELEASE_TAG\") | .id" | head -n 1)
          test -n "$release_id"
          asset_id=$(gh api "repos/$GITHUB_REPOSITORY/releases/$release_id/assets" --jq '.[] | select(.name == "latest.json") | .id')
          test -n "$asset_id"
          gh api "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" -H 'Accept: application/octet-stream' > latest.json
          jq -e --arg version "${RELEASE_TAG#v}" '
            .version == $version and
            ([
              "darwin-aarch64",
              "darwin-x86_64",
              "linux-aarch64",
              "linux-x86_64",
              "windows-x86_64"
            ] - (.platforms | keys) | length == 0) and
            ([.platforms[] | select((.signature | length) == 0 or (.url | length) == 0)] | length == 0)
          ' latest.json
