[package]
name = "claude-blackbox"
version = "0.5.4"
description = "Desktop wrapper for the claude-blackbox session recorder"
authors = ["fantomc0der"]
license = "MIT"
repository = "https://github.com/fantomc0der/claude-blackbox"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "claude_blackbox_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
rfd = { version = "0.15.4", default-features = false, features = ["gtk3"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11.6", features = ["tray-icon"] }
tauri-plugin-opener = "2.5.5"
tauri-plugin-shell = "2.3.6"
tauri-plugin-single-instance = "2.4.5"
tauri-plugin-updater = "2.12.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }
