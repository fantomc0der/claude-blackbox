[package]
name = "claude-blackbox"
version = "0.4.0"
description = "Desktop wrapper for the claude-blackbox session recorder"
authors = ["fantomc0der"]
license = "MIT"
repository = "https://github.com/fantomc0der/claude-blackbox"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "claude_blackbox_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11.6", features = ["tray-icon"] }
tauri-plugin-opener = "2.5.5"
tauri-plugin-shell = "2.3.6"
tauri-plugin-updater = "2.12.0"
